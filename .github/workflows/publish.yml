name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test one tarball without publishing or changing release/catalog
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      version: ${{ steps.pack.outputs.version }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No setup-node registry-url: no placeholder token suppressing OIDC.
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run check
      - run: node --test
      - name: Require the matching immutable tag for real publication
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          gh release view "$RELEASE_TAG" --json tagName
      - name: Pack once and install-test that exact tarball
        id: pack
        run: node scripts/prepare-release.mjs package.json "$RUNNER_TEMP/release"
      - name: Publish tested tarball and verify registry bytes
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        shell: bash
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/publish-release.mjs "$RUNNER_TEMP/release/manifest.json" "$RUNNER_TEMP/release/$TARBALL" "$RELEASE_TAG" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.pack.outcome == 'success'
        with:
          name: tested-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
  recovery:
    needs: publish
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      TARBALL: ${{ needs.publish.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: tested-release
          path: ${{ runner.temp }}/release
      - name: Reverify registry and attach identical recovery files without replacement
        run: node scripts/recovery-assets.mjs "$RUNNER_TEMP/release/manifest.json" "$RUNNER_TEMP/release/$TARBALL" "$RELEASE_TAG" "$GITHUB_REPOSITORY"
  catalog:
    needs: recovery
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          path: catalog
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: release-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: release-tools
      - uses: actions/download-artifact@v4
        with:
          name: tested-release
          path: ${{ runner.temp }}/release
      - name: Verify again and validate the entire current catalog with pinned DSH parser
        id: catalog-version
        shell: bash
        run: |
          echo "version=$(node -p "require(process.env.RUNNER_TEMP + '/release/manifest.json').version")" >> "$GITHUB_OUTPUT"
          mapfile -t tarballs < <(find "$RUNNER_TEMP/release" -maxdepth 1 -name '*.tgz' -type f)
          test "${#tarballs[@]}" = 1
          node release-tools/scripts/update-market.mjs catalog/market/index.json "$RUNNER_TEMP/release/manifest.json" "${tarballs[0]}" https://registry.npmjs.org
      - uses: peter-evans/create-pull-request@v7
        with:
          path: catalog
          base: main
          branch: automation/npm-catalog-${{ steps.catalog-version.outputs.version }}
          add-paths: market/index.json
          commit-message: 'chore: advertise verified npm release'
          title: 'chore: advertise verified npm release'
          body: Registry integrity and exact bytes plus recovery assets verified. Full catalog validated by the pinned real DSH parser. Review and merge normally.
